project:
  type: website
  output-dir: _preview
  resources:
    - fonts/
  # Las respuestas de las tareas se versionan pero NO se publican: viven en el
  # repo y se rinden solo al sacarlas de la exclusión, después de la entrega.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!tareas/*-respuestas.qmd"

execute:
  freeze: auto

website:
  title: "Inferencia Causal 2026"
  favicon: favicon.png
  sidebar:
    background: dark
    logo: "logo-CIDE.jpg"
    pinned: true
    align: center
    style: docked
    search: true
    tools:
      - icon: github
        href: https://github.com/rojasirvin/inferencia-causal
        text: GitHub
      - icon: microsoft-teams
        href: "https://teams.microsoft.com/l/team/19%3ATvIlxcZgqmbyB8H-pxVo94XuSzLqjv_kh4ZENrfmJjs1%40thread.tacv2/conversations?groupId=2389b271-1d8b-42fc-9bbd-c706d4eb11a5&tenantId=9ec59b66-28b5-46a2-b6eb-dbc2cf411b7f"
        text: Microsoft Teams
    contents:
      - section: "Curso"
        contents:
          - href: index.qmd
            text: Inicio
            icon: house
          - href: programa.qmd
            text: Programa
            icon: journal-text
          - href: reglas.qmd
            text: Reglas
            icon: shield-check
          - href: lecturas.qmd
            text: Lecturas
            icon: book
          - href: presentaciones.qmd
            text: Presentaciones
            icon: easel
          - href: cronograma.qmd
            text: Cronograma
            icon: calendar3
      - section: "Materiales"
        contents:
          - href: tareas/index.qmd
            text: Tareas
            icon: pencil-square
          - href: notas/index.qmd
            text: Notas
            icon: sticky
          - href: diapositivas/index.qmd
            text: Diapositivas
            icon: easel2

format:
  html:
    theme:
      dark: theme-dark.scss
      light: theme.scss
    css: fonts/inter.css
    toc: false
    include-in-header: _fonts.html
    lang: es
    from: markdown-native_divs-native_spans
